# Manual release workflow: cut a versioned git tag + build & push the
# bundled-models PocketTTS image (TTS-only, voice cloning off by default).
#
# Trigger: Actions -> "Image release" -> Run workflow.
#   version: leave empty to use the "version" from package.json, or set e.g. 1.1.0.
#   push:    true (default) creates the git tag and pushes the image to GHCR.
#
# See image-data/README.md for the full flow and local usage.
name: Image release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (defaults to the version in package.json)"
        required: false
        default: ""
      push:
        description: "Create the git tag and push the image to GHCR"
        type: boolean
        default: true

# Needs write access to push the git tag (contents) and the image (packages).
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag, build, and push the image
        env:
          PUSH: ${{ inputs.push && '1' || '0' }}
          GHCR_REPO: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: bash image-data/create-image.sh
